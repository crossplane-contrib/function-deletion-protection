apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    name: networks.aws.platform.upbound.io
spec:
    group: aws.platform.upbound.io
    scope: Namespaced
    names:
        kind: Network
        plural: networks
    versions:
        - name: v1alpha1
          served: true
          referenceable: true
          schema:
            openAPIV3Schema:
                type: object
                properties:
                    spec:
                        type: object
                        properties:
                            parameters:
                                description: Network Parameters
                                properties:
                                    id:
                                        type: string
                                        description: ID of this Network that other objects will use to refer to it.
                                    region:
                                        type: string
                                        description: Region is the region you'd like your resource to be created in.
                                    managementPolicies:
                                        description: Management policies for the managed resources. Defaults to full management.
                                        type: array
                                        default:
                                            - '*'
                                        items:
                                            type: string
                                            enum:
                                                - Observe
                                                - Create
                                                - Update
                                                - Delete
                                                - LateInitialize
                                                - '*'
                                    providerConfigName:
                                        description: Crossplane ProviderConfig to use for provisioning this resources
                                        type: string
                                        default: default
                                    vpcCidrBlock:
                                        type: string
                                        description: CIDR block for the VPC
                                        default: 192.168.0.0/16
                                    subnets:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                availabilityZone:
                                                    type: string
                                                type:
                                                    type: string
                                                    enum:
                                                        - public
                                                        - private
                                                cidrBlock:
                                                    type: string
                                        description: Subnets to create in the VPC
                                        required:
                                            - availabilityZone
                                            - type
                                            - cidrBlock
                                        default:
                                            - availabilityZone: us-west-2a
                                              type: public
                                              cidrBlock: 192.168.0.0/18
                                            - availabilityZone: us-west-2b
                                              type: public
                                              cidrBlock: 192.168.64.0/18
                                            - availabilityZone: us-west-2a
                                              type: private
                                              cidrBlock: 192.168.128.0/18
                                            - availabilityZone: us-west-2b
                                              type: private
                                              cidrBlock: 192.168.192.0/18
                                required:
                                    - managementPolicies
                                    - providerConfigName
                                    - id
                                    - region
                                    - subnets
                                    - vpcCidrBlock
                                type: object
                        required:
                            - parameters
                    status:
                        type: object
                        properties:
                            vpcId:
                                type: string
                            subnetIds:
                                type: array
                                items:
                                    type: string
                            publicSubnetIds:
                                type: array
                                items:
                                    type: string
                            privateSubnetIds:
                                type: array
                                items:
                                    type: string
                            securityGroupIds:
                                type: array
                                items:
                                    type: string
